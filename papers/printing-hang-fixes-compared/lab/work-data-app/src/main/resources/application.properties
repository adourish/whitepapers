server.port=18093
spring.application.name=lab-work-data

# The H2 server is started by run_lab.py as its own process (port 19092)
spring.datasource.url=jdbc:h2:tcp://localhost:19092/mem:lab;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Same as the live order-data service's database pool settings
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=30000

# Tomcat left at its defaults (200 threads), as the live order-data service sets nothing
# spring.threads.virtual.enabled is set per run by run_lab.py

# executor: hand the work to printNoticeExecutor and wait (today's code)
# inline:   do the work on the request thread
lab.workdata.mode=executor
lab.db.latency-ms=60
lab.db.round-trips-per-notice=4

logging.level.root=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
