server.port=18084
spring.application.name=lab-notice

lab.work-data.url=http://localhost:18093

# simple: today's shared client. pooled: Apache HttpClient 5 with a pool
lab.client.kind=simple
# 0 means no limit, as today
lab.client.connect-timeout-ms=0
lab.client.read-timeout-ms=0

# Tomcat left at its defaults (200 threads), as the live ticket service sets nothing
# spring.threads.virtual.enabled is set per run by run_lab.py

logging.level.root=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
